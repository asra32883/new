[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# URL comes from TORMAIL_DATABASE_URL via app.config (see migrations/env.py); never put credentials here.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
