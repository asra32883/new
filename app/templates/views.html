{# Every view is an inert <template>; app.js clones one and fills it with textContent only. #}

<template id="v-welcome"><section class="hero">
  <h1 tabindex="-1">Private messages over Tor</h1>
  <p class="lead">A small, closed messaging service reachable only as a Tor onion service. Sign up with just a username and a password:
    no email address, no phone number.</p>
  <p data-auth="out" hidden><a class="button" href="/register" data-link>Create an account</a> <a class="button secondary" href="/login" data-link>Sign in</a></p>
  <p data-auth="in" hidden><a class="button" href="/inbox" data-link>Go to your inbox</a> <a class="button secondary" href="/compose" data-link>Write a message</a></p>
  <ul class="features">
    <li><strong>Encrypted in your browser</strong><span>The server stores only ciphertext it cannot read.</span></li>
    <li><strong>No personal details</strong><span>No email, phone number or IP address is stored.</span></li>
    <li><strong>You hold the key</strong><span>Your private key never leaves your browser unencrypted.</span></li>
  </ul>
  <div class="notice">
    <h2>Your address is not an email address</h2>
    <p>Addresses look like <code data-role="example">username@service.onion</code> but only work <strong>between people registered on this service</strong>.
      You cannot send to or receive from Gmail or any other email provider.</p>
  </div>
  <div class="notice warn">
    <h2>What this does not do</h2>
    <ul>
      <li>It does not make you anonymous against every adversary. Tor helps hide where you connect from, not what you do here.</li>
      <li>The service can still see <strong>who writes to whom, when, and how large</strong> a message is. It cannot see subjects or bodies.</li>
      <li>The server delivers the code that encrypts your messages, so you are trusting the operator not to change it.</li>
      <li>If you lose your encryption key and its backup, nobody, including the operator, can recover your messages.</li>
    </ul>
    <p><a href="/privacy" data-link>Read the privacy policy</a>.</p>
  </div>
</section></template>

<template id="v-register"><section class="card narrow">
  <h1 tabindex="-1">Create an account</h1>
  <p>No personal information is needed. Pick a username and a strong password.</p>
  <form data-role="form" novalidate>
    <label for="reg-user">Username</label>
    <input id="reg-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32" aria-describedby="reg-user-hint">
    <p id="reg-user-hint" class="hint">3 to 32 characters: letters, digits, dot, underscore or hyphen. Usernames are not case-sensitive.</p>
    <label for="reg-pass">Password</label>
    <input id="reg-pass" name="password" type="password" autocomplete="new-password" required minlength="12" aria-describedby="reg-pass-hint">
    <p id="reg-pass-hint" class="hint">At least 12 characters. A few random words work well. This is your <em>login</em> password; you will choose a separate passphrase for your encryption key.</p>
    <label for="reg-pass2">Repeat password</label>
    <input id="reg-pass2" name="password2" type="password" autocomplete="new-password" required minlength="12">
    <button type="submit" data-role="submit">Create account</button>
    <p class="hint" data-role="work" hidden>Solving a small puzzle that makes automated sign-ups expensive. This takes a few seconds.</p>
  </form>
  <p>Already registered? <a href="/login" data-link>Sign in</a>.</p>
</section></template>

<template id="v-login"><section class="card narrow">
  <h1 tabindex="-1">Sign in</h1>
  <form data-role="form" novalidate>
    <label for="login-user">Username</label>
    <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
    <label for="login-pass">Password</label>
    <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p>New here? <a href="/register" data-link>Create an account</a>.</p>
</section></template>

<template id="t-unlock"><form class="notice" data-role="unlock-form">
  <h2>Unlock your key</h2>
  <p data-role="why">Your messages are decrypted in this browser. Enter your key passphrase to read or send mail. It stays in memory only until you close or reload this page.</p>
  <label for="unlock-pass-inline">Key passphrase</label>
  <input id="unlock-pass-inline" type="password" autocomplete="off" required>
  <button type="submit">Unlock</button>
</form></template>

<template id="v-mailbox"><section>
  <h1 tabindex="-1" data-role="title"></h1>
  <div data-role="unlock"></div>
  <form data-role="searchform" role="search">
    <label for="search">Search</label>
    <input id="search" type="search" autocomplete="off" aria-describedby="search-hint">
    <p id="search-hint" class="hint">Searches sender, subject and text of the messages loaded below, in your browser. The server cannot search encrypted mail.</p>
  </form>
  <p data-role="count" aria-live="polite"></p>
  <ul class="msglist" data-role="list"></ul>
  <p data-role="empty" hidden>No messages here.</p>
  <button type="button" data-role="more" class="secondary" hidden>Load older messages</button>
</section></template>

<template id="t-msgitem"><li class="msg">
  <div class="msg-main">
    <a class="msg-link" href="#" data-link><span data-role="subject"></span></a>
    <span class="badge" data-role="unread" hidden>Unread</span>
  </div>
  <p class="msg-meta" data-role="meta"></p>
  <p class="msg-actions">
    <button type="button" class="secondary small" data-act="restore" hidden>Restore</button>
    <button type="button" class="danger small" data-act="delete">Delete</button>
  </p>
</li></template>

<template id="v-compose"><section>
  <h1 tabindex="-1">New message</h1>
  <div data-role="unlock"></div>
  <p class="notice warn" data-role="nokey" hidden>You have not set up an encryption key yet. <a href="/keys" data-link>Create one</a> before sending.</p>
  <form data-role="form" novalidate>
    <label for="compose-to">To (usernames, separated by spaces or commas)</label>
    <input id="compose-to" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <label for="compose-subject">Subject</label>
    <input id="compose-subject" type="text" autocomplete="off" maxlength="998">
    <label for="compose-body">Message</label>
    <textarea id="compose-body" rows="12" required></textarea>
    <div class="notice warn" data-role="keychange" hidden>
      <p data-role="keychange-text"></p>
      <label class="check"><input type="checkbox" data-role="keychange-ok"> I verified the new key with this person through another channel, or I accept the risk.</label>
    </div>
    <button type="submit" data-role="send">Encrypt and send</button>
  </form>
  <p class="hint">Subject and message are encrypted in your browser to the recipients' keys (and yours, so you can read your Sent folder).
    The server still sees who you write to, when, and the size.</p>
</section></template>

<template id="v-message"><article>
  <h1 tabindex="-1" data-role="subject"></h1>
  <div data-role="unlock"></div>
  <dl class="headers">
    <dt>From</dt><dd data-role="from"></dd>
    <dt>To</dt><dd data-role="to"></dd>
    <dt>Written</dt><dd data-role="written"></dd>
    <dt>Delivered</dt><dd data-role="delivered"></dd>
  </dl>
  <h2 class="visually-hidden">Trust</h2>
  <ul class="trust" data-role="trust"></ul>
  <div class="notice" data-role="verify" hidden>
    <p>Sender key fingerprint:</p>
    <p><code class="fpr" data-role="fpr"></code></p>
    <p class="hint">Compare this with the fingerprint the sender sees on their Keys page, using a channel other than this service (in person, a call, another messenger).</p>
    <button type="button" class="secondary" data-role="markverified">The fingerprints match</button>
  </div>
  <h2 class="visually-hidden">Message</h2>
  <pre class="body" data-role="body"></pre>
  <p class="actions">
    <a class="button" data-role="reply" data-link href="/compose">Reply</a>
    <button type="button" class="secondary" data-role="restore" hidden>Restore</button>
    <button type="button" class="danger" data-role="delete">Delete</button>
  </p>
</article></template>

<template id="t-session"><li class="session">
  <span data-role="info"></span>
  <button type="button" class="secondary small" data-role="revoke">Sign out this session</button>
</li></template>

<template id="v-settings"><section>
  <h1 tabindex="-1">Settings</h1>

  <section aria-labelledby="h-account">
    <h2 id="h-account">Your address</h2>
    <p><code data-role="address"></code></p>
    <p class="hint">An application-level address: it works only between users of this service, not with ordinary email providers.</p>
    <p>Your <a href="/keys" data-link>encryption keys</a> are managed separately.</p>
  </section>

  <section aria-labelledby="h-password">
    <h2 id="h-password">Change login password</h2>
    <form data-role="pwform" novalidate>
      <label for="pw-current">Current password</label>
      <input id="pw-current" type="password" autocomplete="current-password" required>
      <label for="pw-new">New password (at least 12 characters)</label>
      <input id="pw-new" type="password" autocomplete="new-password" required minlength="12">
      <label for="pw-new2">Repeat new password</label>
      <input id="pw-new2" type="password" autocomplete="new-password" required minlength="12">
      <button type="submit">Change password</button>
    </form>
    <p class="hint">Changing your login password signs out your other sessions. It does not change your encryption key passphrase.</p>
  </section>

  <section aria-labelledby="h-sessions">
    <h2 id="h-sessions">Active sessions</h2>
    <ul class="sessions" data-role="sessions"></ul>
    <button type="button" class="secondary" data-role="logout-all">Sign out everywhere</button>
  </section>

  <section aria-labelledby="h-key">
    <h2 id="h-key">Key lock</h2>
    <p data-role="lockstate"></p>
    <p class="hint">Your key also locks by itself after 15 minutes without activity.</p>
    <button type="button" class="secondary" data-role="lock">Lock key now</button>
  </section>

  <section aria-labelledby="h-chatpriv">
    <h2 id="h-chatpriv">Chat privacy</h2>
    <label class="check"><input type="checkbox" data-role="receipts"> Let others see when I have read their chat messages</label>
    <p class="hint">Off: people you chat with cannot tell whether you read their messages. Sending a message still shows that you were active, and this setting is kept in this browser only.</p>
  </section>

  <section aria-labelledby="h-delete">
    <h2 id="h-delete">Delete account</h2>
    <p>Deleting your account removes your login, your public key and your mailbox. Messages you already sent <strong>stay in the recipients' mailboxes</strong>
      (the service cannot reach into other people's mail), but they no longer name you as the sender. This cannot be undone.</p>
    <form data-role="delform" novalidate>
      <label for="del-pass">Your login password</label>
      <input id="del-pass" type="password" autocomplete="current-password" required>
      <label class="check"><input id="del-wipe" type="checkbox" checked> Also remove my encryption keys stored in this browser</label>
      <label class="check"><input id="del-ack" type="checkbox" required> I understand this cannot be undone.</label>
      <button type="submit" class="danger">Delete my account</button>
    </form>
  </section>
</section></template>

<template id="v-keys"><section>
  <h1 tabindex="-1">Encryption keys</h1>
  <div id="keys-ui">
    <section id="s-overview" aria-labelledby="h-overview">
      <h2 id="h-overview">Your key</h2>
      <p>Current key fingerprint. Compare it with your contacts through another channel to confirm it really is yours:</p>
      <p><code id="fingerprint" class="fpr">none yet</code></p>
      <ul>
        <li id="local-state"></li>
        <li id="unlock-state"></li>
      </ul>
    </section>

    <section id="s-unlock" aria-labelledby="h-unlock" hidden>
      <h2 id="h-unlock">Unlock</h2>
      <form id="f-unlock">
        <label for="unlock-pass">Key passphrase</label>
        <input id="unlock-pass" type="password" autocomplete="off" required>
        <button type="submit">Unlock for this session</button>
      </form>
      <p class="hint">Your key stays unlocked in memory only until you close or reload this page.</p>
    </section>

    <section id="s-create" aria-labelledby="h-create" hidden>
      <h2 id="h-create">Create your encryption key</h2>
      <p id="rotate-warning" class="notice warn" hidden>
        Creating a new key replaces your current one. Your old key stays in this browser so you can still read old mail,
        but contacts will see a "key changed" warning until they verify your new fingerprint.</p>
      <p>The key is generated in your browser and protected by a passphrase. The passphrase is separate from your login password
        and is never sent to the server.</p>
      <form id="f-create">
        <label for="create-pass">Key passphrase (at least 14 characters)</label>
        <input id="create-pass" type="password" autocomplete="new-password" required minlength="14">
        <label for="create-pass2">Repeat passphrase</label>
        <input id="create-pass2" type="password" autocomplete="new-password" required minlength="14">
        <label class="check"><input id="create-ack" type="checkbox" required>
          I understand that if I lose both this browser's copy and my backup file, or forget the passphrase,
          my messages cannot be recovered by anyone, including the administrators.</label>
        <button type="submit" id="create-btn">Create key</button>
      </form>
    </section>

    <section id="s-export" aria-labelledby="h-export" hidden>
      <h2 id="h-export">Export and backup</h2>
      <p><button type="button" id="dl-public" class="secondary">Download public key</button>
         <button type="button" id="dl-backup" class="secondary">Download encrypted private key backup</button></p>
      <p class="hint">Keep the backup file somewhere safe. It is useless without your passphrase, but anyone who gets it can try to guess the passphrase offline.</p>
    </section>

    <section id="s-import" aria-labelledby="h-import" hidden>
      <h2 id="h-import">Import a backup</h2>
      <form id="f-import">
        <label for="import-file">Backup file (.asc)</label>
        <input id="import-file" type="file" accept=".asc,.txt,.pgp,.key" required>
        <label for="import-pass">Its passphrase</label>
        <input id="import-pass" type="password" autocomplete="off" required>
        <button type="submit">Import</button>
      </form>
    </section>

    <section id="s-sync" aria-labelledby="h-sync" hidden>
      <h2 id="h-sync">Optional: store the encrypted backup on the server</h2>
      <p id="sync-state"></p>
      <p class="notice warn">Off by default. If you turn it on, the server stores your passphrase-encrypted private key. It cannot decrypt it,
        but anyone with database access could try to guess your passphrase offline, so only do this with a long, random passphrase.</p>
      <form id="f-sync-on" hidden>
        <label class="check"><input id="sync-ack" type="checkbox" required> I understand the risk.</label>
        <button type="submit">Store backup on server</button>
      </form>
      <p><button type="button" id="sync-off" class="secondary" hidden>Remove server backup</button>
         <button type="button" id="sync-restore" class="secondary" hidden>Restore backup from server into this browser</button></p>
    </section>

    <section class="notice" aria-labelledby="h-limits">
      <h2 id="h-limits">What this does and does not protect</h2>
      <ul>
        <li>Messages are encrypted in your browser. The server stores only ciphertext, but still sees who writes to whom, when, and message sizes.</li>
        <li>The server delivers the JavaScript that does the encryption. A malicious or compromised server could serve altered code. Published file hashes are at
          <a href="/.well-known/assets.json">/.well-known/assets.json</a>.</li>
        <li>A key fetched from the server is not verified until you compare fingerprints with its owner through another channel.</li>
      </ul>
    </section>
  </div>
</section></template>

<template id="v-privacy"><article>
  <h1 tabindex="-1">Privacy policy</h1>
  <p class="hint">This is the operator's policy for this service. It describes what the software does; the operator is responsible for running it as described.</p>

  <h2>Operator</h2>
  <p>{% if policy.contact %}{{ policy.contact }}{% else %}The operator has not published contact details.{% endif %}</p>

  <h2>What we collect</h2>
  <ul>
    <li><strong>Username</strong> and an <strong>Argon2id hash</strong> of your login password. We never store the password itself.</li>
    <li>Your <strong>public encryption key</strong> and its fingerprint. If you opt in, also a <strong>passphrase-encrypted copy of your private key</strong>, which we cannot decrypt.</li>
    <li><strong>Messages as ciphertext.</strong> Subjects, bodies and the full recipient list are encrypted inside the message.</li>
    <li><strong>Message metadata:</strong> which account sent a message, which accounts received it, when, its size, whether it was read, and which folder it is in.</li>
    <li><strong>Sessions:</strong> a hash of a random session token, and when it was created, last used and expires. No IP address and no browser details are stored.</li>
    <li><strong>Abuse-control counters</strong> under keyed hashes (failed logins, sign-up and send rates). They contain no usernames or addresses in readable form.</li>
  </ul>

  <h2>What we do not collect</h2>
  <p>No email address, phone number or real name. No IP addresses (the service is reachable only through Tor and sees only Tor's connections). No analytics,
    no advertising, no third-party scripts, fonts or images. Web server access logs are switched off, and application logs contain event codes only: never usernames, passwords, tokens, keys or message content.</p>

  <h2>Cookies and browser storage</h2>
  <p>One session cookie (HttpOnly, Secure, SameSite=Strict) keeps you signed in. Your browser's local storage holds your passphrase-protected private key
    and the key fingerprints you have seen for your contacts. Your unlocked key is kept in memory only.</p>

  <h2>What the operator can and cannot see</h2>
  <p><strong>Can see:</strong> usernames, when accounts were created and last signed in, public keys, who sent messages to whom and when, message sizes and read state.</p>
  <p><strong>Cannot see</strong> (assuming the published, unmodified code is running and you chose a strong key passphrase): subjects, message text, your private key, your key passphrase, your login password.</p>
  <p><strong>Chats:</strong> the operator can also see which chats exist, who is in each (and when that changes), who sent each chat message and when, message and file sizes, the disappearing-message timer, and how far each member has read (unless that person turned read receipts off).
    It cannot see message text, replies, reactions, edits, file names or contents, or group names.</p>
  <p><strong>Important limit:</strong> this is a web application, so the server delivers the code that encrypts your messages. An operator who deliberately served altered code could read what you type.
    The hashes of the delivered files are published at <a href="/.well-known/assets.json">/.well-known/assets.json</a>.</p>

  <h2>Retention</h2>
  <ul>
    <li>Chat messages stay until the sender deletes them, a disappearing-message timer runs out, or the chat is removed. Deleting or expiring a message removes the stored copy; it cannot recall copies already on someone's screen, in a screenshot, or in a backup made before.</li>
    <li>Chat attachments are deleted with their message. An upload that is never sent is deleted after one hour.</li>
    <li>Messages you move to Trash are deleted permanently after <strong>{{ policy.trash_days }} days</strong>, or immediately when you delete them from Trash.</li>
    <li>Sessions end after <strong>{{ policy.idle_minutes }} minutes</strong> of inactivity or <strong>{{ policy.absolute_hours }} hours</strong> in total, whichever comes first.</li>
    <li>A message is removed from the server once the sender and every recipient have deleted their copy.</li>
    <li>Abuse-control counters expire within hours.</li>
    <li>Database backups, if the operator keeps any, should be encrypted and are subject to the same retention limits within the operator's backup rotation.</li>
  </ul>

  <h2>Deleting your account</h2>
  <p>You can delete your account in Settings. That removes your login, keys, sessions and mailbox. Messages you sent remain in recipients' mailboxes, without a link to your account,
    until they delete them.</p>

  <h2>Limits you should know about</h2>
  <ul>
    <li>Tor reduces what others can learn about where you connect from. It does not guarantee anonymity.</li>
    <li>If you lose your key and its backup, your messages cannot be recovered by anyone.</li>
    <li>Messages are limited to {{ policy.max_kb }} KB. Addresses work only between users of this service.</li>
  </ul>

  <h2>Changes</h2>
  <p>If this policy changes, the new version will be published on this page.</p>
</article></template>

      <button type="button" class="linklike" data-act="react" aria-expanded="false">React</button>
      <button type="button" class="linklike" data-act="edit" hidden>Edit</button>
      <button type="button" class="linklike" data-act="delete" hidden>Delete</button>
    </div>
  </article>
</li></template>

<template id="t-info"><div>
  <h3>Members</h3>
  <p class="hint" data-role="memberhint"></p>
  <ul class="members" data-role="members"></ul>
  <form data-role="addform" hidden novalidate>
    <label for="add-members">Add people (usernames separated by spaces or commas)</label>
    <input id="add-members" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button type="submit">Add</button>
    <p class="hint">New people can read messages sent after they join, not earlier ones.</p>
  </form>
  <h3>Disappearing messages</h3>
  <label for="ttl-select" class="visually-hidden">Delete new messages after</label>
  <select id="ttl-select" data-role="ttl"></select>
  <p class="hint">New messages are deleted from the server after this time and hidden from everyone's screen. It cannot stop someone from copying or photographing a message, or a modified server from keeping it.</p>
  <h3>This chat</h3>
  <button type="button" class="secondary" data-role="hide" hidden>Clear and hide this chat for me</button>
  <button type="button" class="danger" data-role="leave" hidden>Leave group</button>
</div></template>

<template id="v-newchat"><section class="card">
  <h1 tabindex="-1">New chat</h1>
  <div data-role="unlock"></div>
  <form data-role="direct" novalidate>
    <h2>One-to-one</h2>
    <label for="nc-user">Username</label>
    <input id="nc-user" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="64">
    <button type="submit">Start chat</button>
  </form>
  <form data-role="group" novalidate>
    <h2>Group</h2>
    <label for="nc-title">Group name</label>
    <input id="nc-title" type="text" autocomplete="off" required maxlength="80" aria-describedby="nc-title-hint">
    <p id="nc-title-hint" class="hint">The name is encrypted too. The service cannot read it.</p>
    <label for="nc-members">Members (usernames separated by spaces or commas)</label>
    <input id="nc-members" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <button type="submit">Create group</button>
  </form>
  <div class="notice warn" data-role="keynote" hidden>
    <p data-role="keynote-text"></p>
    <button type="button" data-role="keynote-yes">Continue anyway</button>
    <button type="button" class="secondary" data-role="keynote-no">Cancel</button>
  </div>
  <p class="hint">Everyone must have created an encryption key first.</p>
</section></template>
